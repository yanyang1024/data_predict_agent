services:
  mariadb:
    image: mariadb:11
    container_name: flash-agents-mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: flash_agents
      MYSQL_USER: flash
      MYSQL_PASSWORD: flash
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-connections=500
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

volumes:
  mariadb_data:
