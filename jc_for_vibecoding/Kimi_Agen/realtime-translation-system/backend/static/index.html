<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实时语音转录翻译系统</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: #1a1a24;
            --border-color: #2a2a3a;
            --text-primary: #e0e0e0;
            --text-secondary: #8b8b9a;
            --accent-blue: #4fc3f7;
            --accent-green: #69f0ae;
            --accent-yellow: #ffd54f;
            --accent-red: #ff5252;
            --streaming-glow: rgba(79, 195, 247, 0.3);
            --correcting-glow: rgba(255, 213, 79, 0.3);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB',
                'Microsoft YaHei', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
        }

        #root {
            height: 100vh;
        }

        /* App Layout */
        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 24px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
        }

        .header-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .header-subtitle {
            font-size: 12px;
            color: var(--text-secondary);
            margin-left: 12px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        /* Connection Status */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .status-badge.connected {
            background: rgba(105, 240, 174, 0.15);
            color: var(--accent-green);
        }

        .status-badge.disconnected {
            background: rgba(255, 82, 82, 0.15);
            color: var(--accent-red);
        }

        .status-badge.connecting {
            background: rgba(255, 213, 79, 0.15);
            color: var(--accent-yellow);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 20px;
        }

        .control-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .section-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Mic Button */
        .mic-button {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 2px solid var(--border-color);
            background: var(--bg-card);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            align-self: center;
            position: relative;
        }

        .mic-button:hover {
            border-color: var(--accent-blue);
            transform: scale(1.05);
        }

        .mic-button.recording {
            border-color: var(--accent-red);
            background: rgba(255, 82, 82, 0.1);
            animation: mic-pulse 1.5s infinite;
        }

        @keyframes mic-pulse {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(255, 82, 82, 0.4);
            }
            50% {
                box-shadow: 0 0 0 15px rgba(255, 82, 82, 0);
            }
        }

        .mic-icon {
            width: 36px;
            height: 36px;
            fill: var(--text-primary);
        }

        .mic-button.recording .mic-icon {
            fill: var(--accent-red);
        }

        /* Audio Visualizer */
        .visualizer {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            height: 40px;
            gap: 3px;
        }

        .visualizer-bar {
            width: 4px;
            background: linear-gradient(to top, var(--accent-blue), var(--accent-green));
            border-radius: 2px;
            transition: height 0.05s ease;
            min-height: 3px;
        }

        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 700;
            color: var(--accent-blue);
        }

        .stat-label {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* Content Area */
        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Segments Container */
        .segments-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .segments-container::-webkit-scrollbar {
            width: 6px;
        }

        .segments-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .segments-container::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }

        /* Segment Card */
        .segment-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .segment-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            border-radius: 12px 0 0 12px;
        }

        .segment-card.status-confirmed::before {
            background: var(--accent-green);
        }

        .segment-card.status-streaming::before {
            background: var(--accent-blue);
            animation: streaming-bar 1s infinite;
        }

        .segment-card.status-correcting::before {
            background: var(--accent-yellow);
            animation: correcting-flash 0.5s infinite;
        }

        @keyframes streaming-bar {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        @keyframes correcting-flash {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        .segment-card.correcting {
            animation: correcting-glow 1s ease;
        }

        @keyframes correcting-glow {
            0% { box-shadow: 0 0 0 0 var(--correcting-glow); }
            50% { box-shadow: 0 0 20px 0 var(--correcting-glow); }
            100% { box-shadow: 0 0 0 0 var(--correcting-glow); }
        }

        /* Segment Header */
        .segment-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .segment-id {
            font-size: 11px;
            color: var(--text-secondary);
            font-family: 'Courier New', monospace;
        }

        .segment-status {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 500;
        }

        .segment-status.confirmed {
            background: rgba(105, 240, 174, 0.15);
            color: var(--accent-green);
        }

        .segment-status.streaming {
            background: rgba(79, 195, 247, 0.15);
            color: var(--accent-blue);
        }

        .segment-status.correcting {
            background: rgba(255, 213, 79, 0.15);
            color: var(--accent-yellow);
            animation: status-pulse 0.5s infinite;
        }

        @keyframes status-pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Text Content */
        .text-row {
            display: flex;
            gap: 16px;
            align-items: flex-start;
        }

        .text-label {
            font-size: 11px;
            color: var(--text-secondary);
            font-weight: 600;
            min-width: 36px;
            padding-top: 2px;
        }

        .text-content {
            flex: 1;
            font-size: 15px;
            line-height: 1.6;
            word-break: break-all;
        }

        .chinese-text {
            color: var(--text-primary);
        }

        .english-text {
            color: var(--accent-blue);
        }

        .english-text.streaming {
            border-right: 2px solid var(--accent-blue);
            animation: cursor-blink 0.8s infinite;
            padding-right: 4px;
        }

        @keyframes cursor-blink {
            0%, 100% { border-color: transparent; }
            50% { border-color: var(--accent-blue); }
        }

        /* Diff Highlight */
        .diff-delete {
            background: rgba(255, 82, 82, 0.3);
            text-decoration: line-through;
            padding: 0 2px;
            border-radius: 2px;
        }

        .diff-insert {
            background: rgba(105, 240, 174, 0.3);
            padding: 0 2px;
            border-radius: 2px;
            animation: diff-insert-glow 1s ease;
        }

        @keyframes diff-insert-glow {
            0% { background: rgba(105, 240, 174, 0.6); }
            100% { background: rgba(105, 240, 174, 0.3); }
        }

        /* Empty State */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-secondary);
            text-align: center;
            padding: 40px;
        }

        .empty-icon {
            width: 64px;
            height: 64px;
            margin-bottom: 16px;
            opacity: 0.3;
        }

        .empty-title {
            font-size: 18px;
            margin-bottom: 8px;
        }

        .empty-desc {
            font-size: 14px;
            opacity: 0.7;
        }

        /* Scroll to bottom button */
        .scroll-bottom-btn {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            z-index: 100;
        }

        .scroll-bottom-btn:hover {
            background: var(--accent-blue);
            color: #000;
        }

        /* Settings Panel */
        .settings-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .settings-label {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .settings-value {
            font-size: 13px;
            color: var(--text-primary);
            font-family: 'Courier New', monospace;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                width: 200px;
            }
            .header-title {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // ============ WebSocket Hook ============
        const useWebSocket = (url) => {
            const [connected, setConnected] = useState(false);
            const [messages, setMessages] = useState([]);
            const ws = useRef(null);
            const reconnectTimer = useRef(null);

            const connect = useCallback(() => {
                try {
                    ws.current = new WebSocket(url);

                    ws.current.onopen = () => {
                        console.log('WebSocket 已连接');
                        setConnected(true);
                    };

                    ws.current.onclose = () => {
                        console.log('WebSocket 已断开');
                        setConnected(false);
                        // 自动重连
                        reconnectTimer.current = setTimeout(connect, 3000);
                    };

                    ws.current.onerror = (error) => {
                        console.error('WebSocket 错误:', error);
                    };

                    ws.current.onmessage = (event) => {
                        try {
                            const data = JSON.parse(event.data);
                            setMessages(prev => [...prev, data]);
                        } catch (e) {
                            console.error('消息解析错误:', e);
                        }
                    };
                } catch (e) {
                    console.error('连接失败:', e);
                }
            }, [url]);

            const disconnect = useCallback(() => {
                if (reconnectTimer.current) {
                    clearTimeout(reconnectTimer.current);
                }
                if (ws.current) {
                    ws.current.close();
                }
            }, []);

            const send = useCallback((data) => {
                if (ws.current && ws.current.readyState === WebSocket.OPEN) {
                    ws.current.send(JSON.stringify(data));
                }
            }, []);

            const sendBinary = useCallback((data) => {
                if (ws.current && ws.current.readyState === WebSocket.OPEN) {
                    ws.current.send(data);
                }
            }, []);

            useEffect(() => {
                connect();
                return () => disconnect();
            }, [connect, disconnect]);

            return { connected, messages, send, sendBinary, connect, disconnect };
        };

        // ============ Audio Capture Hook ============
        const useAudioCapture = (onAudioChunk) => {
            const [isRecording, setIsRecording] = useState(false);
            const audioContext = useRef(null);
            const mediaStream = useRef(null);
            const processor = useRef(null);
            const analyser = useRef(null);

            const startRecording = useCallback(async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({
                        audio: {
                            sampleRate: 16000,
                            channelCount: 1,
                            echoCancellation: true,
                            noiseSuppression: true,
                        }
                    });

                    mediaStream.current = stream;
                    audioContext.current = new AudioContext({ sampleRate: 16000 });

                    const source = audioContext.current.createMediaStreamSource(stream);
                    analyser.current = audioContext.current.createAnalyser();
                    analyser.current.fftSize = 256;

                    processor.current = audioContext.current.createScriptProcessor(1600, 1, 1);
                    processor.current.onaudioprocess = (e) => {
                        const inputData = e.inputBuffer.getChannelData(0);
                        // 转换为 PCM16
                        const pcmData = new Int16Array(inputData.length);
                        for (let i = 0; i < inputData.length; i++) {
                            pcmData[i] = Math.max(-32768, Math.min(32767, inputData[i] * 32768));
                        }
                        onAudioChunk(pcmData.buffer);
                    };

                    source.connect(analyser.current);
                    analyser.current.connect(processor.current);
                    processor.current.connect(audioContext.current.destination);

                    setIsRecording(true);
                } catch (err) {
                    console.error('麦克风访问失败:', err);
                    alert('无法访问麦克风，请检查权限设置');
                }
            }, [onAudioChunk]);

            const stopRecording = useCallback(() => {
                if (processor.current) {
                    processor.current.disconnect();
                    processor.current = null;
                }
                if (audioContext.current) {
                    audioContext.current.close();
                    audioContext.current = null;
                }
                if (mediaStream.current) {
                    mediaStream.current.getTracks().forEach(track => track.stop());
                    mediaStream.current = null;
                }
                setIsRecording(false);
            }, []);

            const getAudioLevel = useCallback(() => {
                if (!analyser.current) return 0;
                const dataArray = new Uint8Array(analyser.current.frequencyBinCount);
                analyser.current.getByteFrequencyData(dataArray);
                const average = dataArray.reduce((a, b) => a + b) / dataArray.length;
                return average / 255;
            }, []);

            return {
                isRecording,
                startRecording,
                stopRecording,
                getAudioLevel,
            };
        };

        // ============ Components ============

        const StatusBadge = ({ connected }) => {
            const status = connected ? 'connected' : 'disconnected';
            const label = connected ? '已连接' : '未连接';
            return (
                <span className={`status-badge ${status}`}>
                    <span className="status-dot"></span>
                    {label}
                </span>
            );
        };

        const AudioVisualizer = ({ getAudioLevel, isRecording }) => {
            const [bars, setBars] = useState(new Array(20).fill(3));
            const animationRef = useRef(null);

            useEffect(() => {
                if (!isRecording) {
                    setBars(new Array(20).fill(3));
                    return;
                }

                const animate = () => {
                    const level = getAudioLevel();
                    setBars(prev => prev.map((_, i) => {
                        const baseHeight = 3 + level * 35;
                        const randomVariation = Math.random() * 10;
                        const waveEffect = Math.sin(Date.now() / 100 + i) * 5;
                        return Math.max(3, Math.min(40, baseHeight + randomVariation + waveEffect));
                    }));
                    animationRef.current = requestAnimationFrame(animate);
                };

                animationRef.current = requestAnimationFrame(animate);
                return () => cancelAnimationFrame(animationRef.current);
            }, [isRecording, getAudioLevel]);

            return (
                <div className="visualizer">
                    {bars.map((height, i) => (
                        <div
                            key={i}
                            className="visualizer-bar"
                            style={{ height: `${height}px` }}
                        />
                    ))}
                </div>
            );
        };

        const SegmentCard = ({ segment }) => {
            const [showDiff, setShowDiff] = useState(false);
            const [prevText, setPrevText] = useState(segment.chinese_text);

            useEffect(() => {
                if (segment.chinese_status === 'correcting') {
                    setShowDiff(true);
                    const timer = setTimeout(() => setShowDiff(false), 2000);
                    return () => clearTimeout(timer);
                }
            }, [segment.version]);

            const statusClass = segment.chinese_status === 'confirmed'
                ? 'confirmed'
                : segment.chinese_status === 'correcting'
                ? 'correcting'
                : 'streaming';

            const statusText = segment.chinese_status === 'confirmed'
                ? '已确认'
                : segment.chinese_status === 'correcting'
                ? '修正中'
                : '识别中';

            return (
                <div className={`segment-card status-${statusClass} ${segment.chinese_status === 'correcting' ? 'correcting' : ''}`}>
                    <div className="segment-header">
                        <span className="segment-id">#{segment.id}</span>
                        <span className={`segment-status ${statusClass}`}>{statusText}</span>
                    </div>
                    <div className="text-row">
                        <span className="text-label">原文</span>
                        <span className="text-content chinese-text">
                            {segment.chinese_text}
                        </span>
                    </div>
                    <div className="text-row">
                        <span className="text-label">译文</span>
                        <span className={`text-content english-text ${segment.english_status === 'streaming' ? 'streaming' : ''}`}>
                            {segment.english_text || '...'}
                        </span>
                    </div>
                </div>
            );
        };

        const EmptyState = () => (
            <div className="empty-state">
                <svg className="empty-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                    <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                </svg>
                <div className="empty-title">等待语音输入</div>
                <div className="empty-desc">点击麦克风按钮开始实时转录和翻译</div>
            </div>
        );

        // ============ Main App ============

        const App = () => {
            const sessionId = useRef(`session_${Date.now()}`);
            const [segments, setSegments] = useState([]);
            const [stats, setStats] = useState({
                asrCalls: 0,
                corrections: 0,
                translations: 0,
                duration: '00:00',
            });
            const [autoScroll, setAutoScroll] = useState(true);
            const segmentsEndRef = useRef(null);
            const messagesEndRef = useRef(null);

            // WebSocket
            const wsUrl = `ws://${window.location.host}/ws/${sessionId.current}`;
            const { connected, messages, send, sendBinary } = useWebSocket(wsUrl);

            // 处理音频数据
            const handleAudioChunk = useCallback((audioBuffer) => {
                sendBinary(audioBuffer);
            }, [sendBinary]);

            // Audio Capture
            const { isRecording, startRecording, stopRecording, getAudioLevel } =
                useAudioCapture(handleAudioChunk);

            // 开始/停止录音
            const toggleRecording = useCallback(async () => {
                if (isRecording) {
                    send({ type: 'audio.stop' });
                    stopRecording();
                } else {
                    await startRecording();
                    send({ type: 'audio.start' });
                }
            }, [isRecording, startRecording, stopRecording, send]);

            // 处理 WebSocket 消息
            useEffect(() => {
                if (messages.length === 0) return;

                const latestMessages = messages.slice(-5); // 处理最近的消息

                latestMessages.forEach(msg => {
                    switch (msg.type) {
                        case 'asr.new_segment':
                            setSegments(prev => [...prev, msg.segment]);
                            break;

                        case 'asr.correction':
                            setSegments(prev => prev.map(s =>
                                s.id === msg.segment.id ? msg.segment : s
                            ));
                            setStats(prev => ({ ...prev, corrections: prev.corrections + 1 }));
                            break;

                        case 'segment.finalized':
                            setSegments(prev => prev.map(s =>
                                s.id === msg.segment.id ? msg.segment : s
                            ));
                            setStats(prev => ({ ...prev, translations: prev.translations + 1 }));
                            break;

                        case 'translation.streaming':
                            setSegments(prev => prev.map(s =>
                                s.id === msg.segment_id
                                    ? { ...s, english_text: msg.text, english_status: 'streaming' }
                                    : s
                            ));
                            break;

                        case 'translation.final':
                            setSegments(prev => prev.map(s =>
                                s.id === msg.segment_id
                                    ? { ...s, english_text: msg.text, english_status: 'confirmed' }
                                    : s
                            ));
                            break;

                        case 'status':
                            console.log('状态:', msg.status, msg.message);
                            break;

                        case 'heartbeat':
                            break;
                    }
                });
            }, [messages]);

            // 自动滚动
            useEffect(() => {
                if (autoScroll && segmentsEndRef.current) {
                    segmentsEndRef.current.scrollIntoView({ behavior: 'smooth' });
                }
            }, [segments, autoScroll]);

            // 统计
            useEffect(() => {
                const timer = setInterval(() => {
                    if (isRecording) {
                        setStats(prev => ({
                            ...prev,
                            duration: formatDuration(parseDuration(prev.duration) + 1),
                        }));
                    }
                }, 1000);
                return () => clearInterval(timer);
            }, [isRecording]);

            const formatDuration = (seconds) => {
                const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
                const secs = (seconds % 60).toString().padStart(2, '0');
                return `${mins}:${secs}`;
            };

            const parseDuration = (str) => {
                const [mins, secs] = str.split(':').map(Number);
                return mins * 60 + secs;
            };
