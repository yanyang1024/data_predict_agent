version: '3.8'

services:
  asr-translation:
    build:
      context: .
      dockerfile: Dockerfile
    image: asr-translation:latest
    container_name: asr-translation
    restart: unless-stopped

    # GPU 支持
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    # 端口映射
    ports:
      - "8080:8080"

    # 环境变量
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility

    # 卷挂载
    volumes:
      # 模型缓存目录
      - ./models:/root/.cache/huggingface
      # 配置文件
      - ./config.yaml:/app/config.yaml
      # 日志目录
      - ./logs:/app/logs

    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
